<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معرض طابا – نسخة تجريبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1650b8;--blue2:#0e3a8a;--red:#d62839;--bg:#f4f7fc;--sf:#fff;--tx:#14213d;--mu:#5b6783;--bd:#dbe3f1;--ok:#17803d;--wa:#1c9c4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--sf:#16203a;--tx:#eaf0fd;--mu:#9aa8c7;--bd:#29365a;--ok:#4cc57a}}
:root[data-theme="dark"]{--bg:#0d1424;--sf:#16203a;--tx:#eaf0fd;--mu:#9aa8c7;--bd:#29365a;--ok:#4cc57a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
header{background:var(--blue);color:#fff;padding:10px 16px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;max-width:1100px;margin:auto}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1}
.logo b{font-size:30px;font-weight:800;letter-spacing:1px;background:#fff;color:var(--blue);padding:0 14px;border-radius:8px;border-bottom:4px solid var(--red)}
.logo small{font-size:11px;margin-top:3px;opacity:.9}
.ic{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:6px 10px;font-size:15px;position:relative}
.icons{display:flex;gap:6px;justify-content:flex-start}
.badge{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--red);border-radius:10px;font-size:11px;min-width:18px;text-align:center;padding:0 4px}
.search{max-width:1100px;margin:10px auto;display:flex}
.search input{flex:1;border:0;border-radius:10px;padding:9px 14px;font:inherit;background:#fff;color:#14213d}
nav{max-width:1100px;margin:auto;display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav button{background:none;border:0;color:#fff;padding:8px 14px;border-bottom:3px solid transparent;white-space:nowrap;opacity:.85}
nav button.on{border-color:#fff;opacity:1;font-weight:800}
main{max-width:1100px;margin:auto;padding:14px}
.hero{position:relative;border-radius:16px;overflow:hidden;color:#fff;min-height:170px}
.slide{display:none;padding:34px 24px;min-height:170px;flex-direction:column;justify-content:center;gap:6px}
.slide.on{display:flex}
.slide h2{margin:0;font-size:clamp(22px,5vw,36px);font-weight:800}
.slide p{margin:0;opacity:.92}
.s0{background:linear-gradient(120deg,var(--blue),var(--blue2))}.s1{background:linear-gradient(120deg,var(--red),#9d1b29)}.s2{background:linear-gradient(120deg,#0e3a8a,#1650b8 60%,#3a72d8)}.s3{background:linear-gradient(120deg,#9d1b29,var(--blue))}
.dots{position:absolute;bottom:8px;inset-inline:0;display:flex;justify-content:center;gap:6px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.5);padding:0}.dots button.on{background:#fff;width:24px;border-radius:6px}
.tag{text-align:center;color:var(--mu);margin:14px 0 4px;font-weight:600}
h3{margin:22px 0 10px;font-size:20px;border-inline-start:5px solid var(--red);padding-inline-start:10px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cat{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 8px;text-align:center;color:var(--tx)}
.cat span{display:block;font-size:30px}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.row .card{flex:0 0 160px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.row .card{flex-basis:200px}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.img{height:110px;display:grid;place-items:center;font-size:52px;background:linear-gradient(135deg,#e6eefc,#fbe7e9);cursor:pointer;border:0;width:100%}
.card .in{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h4{margin:0;font-size:15px}.card p{margin:0;font-size:13px;color:var(--mu)}
.st{font-size:12px;font-weight:600}.st.a{color:var(--ok)}.st.l{color:#b86a00}.st.n{color:var(--red)}
.new{position:absolute;top:8px;inset-inline-end:8px;background:var(--red);color:#fff;font-size:11px;padding:1px 8px;border-radius:8px}
.acts{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:600;flex:1}
.btn:disabled{background:var(--mu);opacity:.5;cursor:not-allowed}
.btn.red{background:var(--red)}.btn.wa{background:var(--wa)}.btn.ghost{background:var(--sf);color:var(--tx);border:1px solid var(--bd);flex:0}
.btn.ghost.on{color:var(--red);border-color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
select{padding:7px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.info div{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px}
footer{background:var(--blue2);color:#fff;text-align:center;padding:22px 14px;margin-top:26px}
footer a{color:#fff;font-weight:800}
.ov{position:fixed;inset:0;background:rgba(5,10,25,.55);display:none;z-index:50;align-items:center;justify-content:center;padding:14px}
.ov.on{display:flex}
.box{background:var(--sf);border-radius:16px;padding:18px;max-width:480px;width:100%;max-height:88vh;overflow:auto}
.box h2{margin:0 0 8px}
label{display:block;font-size:14px;margin:8px 0 2px;font-weight:600}
input,textarea{width:100%;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.line{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd);padding:8px 0}
.line b{flex:1}
.q{display:flex;align-items:center;gap:8px}.q button{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)}
.note{background:#fff4d6;color:#5a4300;border-radius:10px;padding:10px;font-size:14px;margin:10px 0}
.demo{background:var(--red);color:#fff;text-align:center;font-size:13px;padding:3px}
header{padding:0 14px 10px!important;background:var(--blue2)!important}
.bar{direction:ltr;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;max-width:1100px;margin:auto}
.burger{justify-self:start;margin-top:10px;font-size:22px;padding:4px 12px}
.bar .icons{justify-self:end;margin-top:10px}
.logo{background:#fff;border-radius:0 0 30px 30px;padding:6px 20px 8px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.logo img{height:62px;display:block}
.bn{width:100%;display:block;border-radius:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.two .bn{height:100%;object-fit:cover}
.img{background:#fff!important;padding:6px}.img img{max-width:100%;max-height:100%;object-fit:contain}
.cat span img{height:50px;max-width:100%;object-fit:contain;border-radius:8px}
.line span img{width:44px;height:44px;object-fit:contain}
.ov.dr{justify-content:flex-end;align-items:stretch;padding:0}
.drawer{background:var(--sf);width:290px;max-width:85vw;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.drawer nav{flex-direction:column;overflow:visible}
.drawer nav button,.drawer>button{color:var(--tx);text-align:start;border:0;border-bottom:1px solid var(--bd);background:none;padding:12px 4px;opacity:1;font-weight:600}
.drawer nav button.on{color:var(--blue);border-color:var(--bd);font-weight:800}
.drawer .logo{align-self:center;margin-bottom:10px;border:1px solid var(--bd)}
.car{position:relative;border-radius:14px;overflow:hidden;transition:height .4s;background:var(--sf);min-height:90px}
.car .sl{position:absolute;top:0;left:0;opacity:0;transition:opacity .5s;pointer-events:none}.car .sl.on{opacity:1;pointer-events:auto}
.car.mob .sl{width:100%;height:100%;object-fit:cover}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(14,58,138,.8);color:#fff;font-size:24px;line-height:1;padding:0 0 3px}
.ar.l{left:8px}.ar.r{right:8px}
.cd{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.cd button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.7);box-shadow:0 0 3px rgba(0,0,0,.4)}.cd button.on{width:22px;border-radius:6px;background:var(--red)}
.splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 30%,#2a6bdc,#0e3a8a 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;transition:opacity .5s,transform .5s;overflow:hidden}
.splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.splash .lg{background:#fff;border-radius:28px;padding:14px 26px;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.splash .lg img{height:110px;display:block}
.splash h1{margin:6px 0 0;font-size:clamp(28px,8vw,44px);font-weight:800;animation:up .7s .5s both}
.splash p{margin:0;font-size:clamp(15px,4vw,19px);opacity:.95;animation:up .7s .8s both}
.splash .go{background:var(--red);color:#fff;border:0;border-radius:30px;padding:12px 44px;font-size:20px;font-weight:800;margin-top:10px;box-shadow:0 8px 22px rgba(0,0,0,.35);animation:up .7s 1.1s both,pulse 2s 2s infinite}
.orb{position:absolute;border-radius:50%;opacity:.18;background:#fff;animation:fl 7s ease-in-out infinite}
.o1{width:220px;height:220px;top:-60px;inset-inline-start:-50px}.o2{width:300px;height:300px;bottom:-110px;inset-inline-end:-80px;background:var(--red);opacity:.3;animation-delay:-3s}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes fl{50%{transform:translateY(26px)}}
.acts.col{flex-direction:column}.card .img{height:135px}
.soc{display:flex;gap:8px;padding:12px 0;flex-wrap:wrap}.sc{padding:7px 14px;border-radius:20px;color:#fff!important;font-weight:700;text-decoration:none;font-size:14px}
.sc.fb{background:#1877f2}.sc.ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}.sc.tt{background:#111;border:1px solid #444}
@media(prefers-reduced-motion:reduce){.splash *{animation:none!important}.car,.car .sl{transition:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* TABA refresh layer */
:root{--blue:#1554b9;--blue2:#0b347e;--red:#d9273e;--bg:#f3f6fc;--sf:#fff;--tx:#17243e;--mu:#69758d;--bd:#e2e8f3;--shadow:0 12px 32px rgba(20,45,90,.09)}
body{background:linear-gradient(180deg,#f6f8fd 0,#f3f6fc 46%,#fff 100%);font-feature-settings:"kern"}
header{box-shadow:0 8px 24px rgba(8,35,91,.18);border-bottom:3px solid rgba(255,255,255,.16)}
.bar{max-width:1240px}
.logo{box-shadow:0 10px 24px rgba(0,0,0,.2);border-radius:0 0 26px 26px}
.logo img{height:68px;max-width:180px;object-fit:contain}
.search{max-width:1240px}
.search input{height:46px;border-radius:14px;box-shadow:0 5px 18px rgba(0,0,0,.08);padding-inline:18px}
main{max-width:1240px;padding:20px}
.car{border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.tag{font-size:16px;margin:20px 0 12px}
h3{font-size:21px;margin:30px 0 14px;padding-inline-start:13px}
.cats{grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
.cat{border:1px solid #e8edf6;border-radius:18px;padding:18px 12px;box-shadow:0 6px 18px rgba(20,45,90,.045);transition:transform .2s,box-shadow .2s}
.cat:hover,.card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(20,45,90,.12)}
.cat span{margin-bottom:8px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{border:1px solid #e7ecf5;border-radius:19px;box-shadow:0 7px 22px rgba(20,45,90,.055);transition:transform .2s,box-shadow .2s}
.card .img{height:175px;background:linear-gradient(145deg,#f6f8fc,#fff)!important;padding:12px}
.card .img img{max-height:100%;max-width:100%;object-fit:contain}
.card .in{padding:14px;gap:7px}
.card h4{font-size:16px;line-height:1.5}
.card p{font-size:13px}
.btn{border-radius:12px;padding:10px 13px;box-shadow:0 4px 10px rgba(21,84,185,.12)}
.btn.ghost{box-shadow:none}
.btn.wa{background:#168b53}
.new{padding:3px 10px;border-radius:20px}
.info{gap:14px}
.info div{border:1px solid #e7ecf5;border-radius:18px;padding:18px;box-shadow:0 6px 18px rgba(20,45,90,.045)}
footer{margin-top:42px;padding:30px 16px;background:linear-gradient(135deg,#0b347e,#1554b9)}
.ov{backdrop-filter:blur(5px)}
.box{border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.2);padding:22px}
.drawer{box-shadow:-16px 0 50px rgba(0,0,0,.18)}
.admin-box{max-width:900px;width:100%;max-height:92vh}
.admin-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--bd);padding-bottom:12px}
.admin-head small{color:var(--mu)}
.admin-head h2{margin:2px 0 0}
.demo-warning{background:#fff3d7;color:#75510b;border:1px solid #f0d89d;border-radius:12px;padding:11px;margin:14px 0;font-size:13px}
.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.admin-tabs .btn{flex:0 0 auto}
.admin-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.admin-stat{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:13px}
.admin-stat b{display:block;font-size:24px;color:var(--blue)}
.admin-stat span{font-size:12px;color:var(--mu)}
.admin-table{width:100%;border-collapse:collapse;font-size:13px}
.admin-table th,.admin-table td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:right}
.admin-table th{color:var(--mu);font-weight:700}
.admin-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.admin-row .meta{flex:1;min-width:0}
.admin-row small{display:block;color:var(--mu)}
.admin-row select{max-width:150px}
.admin-section{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.admin-section h3{margin:0 0 10px;font-size:17px}
.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.admin-grid label{margin:0}
.admin-grid input,.admin-grid select{margin-top:4px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card .img{height:205px}}
@media(max-width:600px){main{padding:12px}.grid{gap:10px}.card .img{height:145px}.card .in{padding:11px}.card h4{font-size:14px}.admin-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-grid{grid-template-columns:1fr}.admin-table{font-size:11px}.admin-table th,.admin-table td{padding:8px 5px}}

</style>
</head>
